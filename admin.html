<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Portal — WELFARE TEAM 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"><div class="brand-mark">W</div><div class="brand"><h1>WELFARE TEAM 2026</h1><small>Admin Portal — Treasurer (stage 1) • Chairman (final)</small></div><div class="spacer"></div><span id="meBadge" class="badge">…</span><button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button></div>
<div class="wrap">
  <div class="grid g4" id="kpis"></div>
  <div class="notice" id="roleNote" style="margin-top:12px"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-t="approvals">Approvals Queue</button>
    <button class="tab" data-t="members">Members &amp; Logins</button>
    <button class="tab" data-t="contribs">All Contributions</button>
    <button class="tab" data-t="loans">Loans</button>
    <button class="tab" data-t="fines">Fines</button>
    <button class="tab" data-t="cases">Welfare Cases</button>
    <button class="tab" data-t="meetings">Meetings</button>
    <button class="tab" data-t="reports">Reports</button>
    <button class="tab" data-t="constitution">Constitution</button>
  </div>
  <div id="view"></div>
</div>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
